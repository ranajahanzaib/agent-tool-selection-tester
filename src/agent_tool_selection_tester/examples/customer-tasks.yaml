- id: task_008
  category: similar_names
  prompt: Find customer Jamie Chen.
  plans: [[{ tool: customer.search, arguments: { query: Jamie Chen } }]]
- id: task_009
  category: multi_step
  prompt: Get the customer profile for cus_1010, then list that customer's orders.
  plans:
    [
      [
        { tool: customer.lookup_by_id, arguments: { customer_id: cus_1010 } },
