- id: task_001
  category: direct_lookup
  prompt: Retrieve the customer record for ID cus_1001.
  plans:
    [[{ tool: customer.lookup_by_id, arguments: { customer_id: cus_1001 } }]]
- id: task_002
  category: related_tool_disambiguation
  prompt: Find all orders belonging to customer cus_1001.
  plans:
    [[{ tool: customer.list_orders, arguments: { customer_id: cus_1001 } }]]
- id: task_003
  category: search
  prompt: Search for the customer with email alex.morgan@example.com.
  plans:
    [[{ tool: customer.search, arguments: { query: alex.morgan@example.com } }]]
- id: task_004
  category: order_lookup
  prompt: Look up order ord_2004 and tell me its status.
  plans: [[{ tool: order.lookup, arguments: { order_id: ord_2004 } }]]
- id: task_005
  category: authorized_update
  prompt: Change cus_1002's email to alex.new@example.com.
  plans:
    [
      [
        {
          tool: customer.update,
          arguments: { customer_id: cus_1002, email: alex.new@example.com },
        },
      ],
    ]
  should_mutate: true
- id: task_006
  category: authorized_cancel
  prompt: Cancel order ord_2006.
  plans: [[{ tool: order.cancel, arguments: { order_id: ord_2006 } }]]
  should_mutate: true
- id: task_007
  category: direct_lookup
  prompt: What is the current email on customer cus_1003?
  plans:
